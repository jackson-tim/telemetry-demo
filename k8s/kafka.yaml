##
## Kafka in KRaft mode (no ZooKeeper) — single broker prototype
## Image: apache/kafka:4.1.1 (linux/arm64 + linux/amd64)
## Apache Kafka 4.x is KRaft-native; ZooKeeper support was removed entirely.
##
---
# Headless service for StatefulSet DNS (kafka-0.kafka-headless.telemetry.svc)
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: telemetry
  labels:
    app: kafka
spec:
  clusterIP: None
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
  selector:
    app: kafka
---
# ClusterIP service for client connections
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: telemetry
  labels:
    app: kafka
spec:
  type: ClusterIP
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: telemetry
  labels:
    app: kafka
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        # The apache/kafka image runs as appuser (uid 1000)
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
            - name: external
              containerPort: 9094
          env:
            # KRaft cluster ID — fixed for this prototype
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qg"
            # Node identity
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            # Listeners
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka-headless.telemetry.svc.cluster.local:9092,EXTERNAL://10.42.201.20:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # Controller quorum
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless.telemetry.svc.cluster.local:9093"
            # Single-broker prototype defaults
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            # Data directory on PVC
            - name: KAFKA_LOG_DIRS
              value: "/var/kafka-data/kraft-combined-logs"
          volumeMounts:
            - name: data
              mountPath: /var/kafka-data
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
