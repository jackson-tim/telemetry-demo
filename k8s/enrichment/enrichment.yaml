---
apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
---
# Separate secret for the NetBox API token used by the enrichment consumer.
# In production this should be managed via SOPS — this is the plaintext template.
# Encrypt with: sops --encrypt --in-place telemetry-enrichment-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: telemetry-enrichment-secret
  namespace: telemetry
type: Opaque
stringData:
  NETBOX_TOKEN: "b24f045319919d0982db7a9230cf9aff37326b9d"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-enrichment
  namespace: telemetry
  labels:
    app.kubernetes.io/name: telemetry-enrichment
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: telemetry-pipeline
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-enrichment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-enrichment
        app.kubernetes.io/component: consumer
        app.kubernetes.io/part-of: telemetry-pipeline
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: enrichment-consumer
          image: ghcr.io/beans-assist/telemetry-enrichment:latest
          imagePullPolicy: Always
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: KAFKA_BOOTSTRAP
              value: "kafka.telemetry.svc.cluster.local:9092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry.telemetry.svc.cluster.local:8081"
            - name: CONSUMER_GROUP
              value: "telemetry-enrichment"
            - name: LOG_LEVEL
              value: "INFO"
            - name: RAW_TOPIC
              value: "interface-telemetry-raw"
            - name: ENRICHED_TOPIC
              value: "interface-telemetry-enriched"
            - name: NETBOX_TOPIC
              value: "netbox-changes"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os, sys; sys.exit(0)"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import os, sys; sys.exit(0)"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
      restartPolicy: Always
