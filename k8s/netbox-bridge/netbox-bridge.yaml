---
apiVersion: v1
kind: Service
metadata:
  name: netbox-bridge
  namespace: telemetry
  labels:
    app.kubernetes.io/name: netbox-bridge
    app.kubernetes.io/component: cdc-bridge
    app.kubernetes.io/part-of: telemetry-pipeline
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  selector:
    app.kubernetes.io/name: netbox-bridge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-bridge
  namespace: telemetry
  labels:
    app.kubernetes.io/name: netbox-bridge
    app.kubernetes.io/component: cdc-bridge
    app.kubernetes.io/part-of: telemetry-pipeline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-bridge
        app.kubernetes.io/component: cdc-bridge
        app.kubernetes.io/part-of: telemetry-pipeline
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: bridge
          image: ghcr.io/beans-assist/netbox-bridge:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: KAFKA_BOOTSTRAP
              value: "kafka.telemetry.svc.cluster.local:9092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry.telemetry.svc.cluster.local:8081"
            - name: NETBOX_URL
              value: "https://netbox.idge.net"
            - name: KAFKA_TOPIC
              value: "netbox-changes"
            - name: NETBOX_TLS_VERIFY
              value: "false"
            - name: AUTO_SYNC_ON_START
              value: "true"
            - name: LOG_LEVEL
              value: "INFO"
            - name: NETBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telemetry-enrichment-secret
                  key: NETBOX_TOKEN
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 15
