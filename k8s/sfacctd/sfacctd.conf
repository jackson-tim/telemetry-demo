!
! sfacctd.conf — sFlow collector with BGP daemon + Kafka output
! Part of the telemetry-demo pipeline
!

! --- Core sFlow settings ---
sfacctd_port: 6343
sfacctd_ip: 0.0.0.0

! --- Aggregation primitives ---
! These define what fields we collect per flow
aggregate: src_host, dst_host, src_port, dst_port, proto, \
           tos, in_iface, out_iface, \
           src_as, dst_as, peer_src_as, peer_dst_as, \
           peer_src_ip, peer_dst_ip, \
           src_std_comm, dst_std_comm, \
           sampling_rate, tag, tag2

! --- BGP daemon ---
! sfacctd runs a BGP speaker to receive routes from the network.
! This enables AS path, community, and next-hop enrichment on flows.
bgp_daemon: true
bgp_daemon_ip: 0.0.0.0
bgp_daemon_port: 179
bgp_daemon_as: 65000
bgp_daemon_max_peers: 50
bgp_aspath_radius: 0
bgp_stdcomm_pattern_to_asn: 0

! Populate AS info from BGP rather than flow data (more accurate)
nfacctd_as: bgp
nfacctd_net: bgp

! BGP community-based tagging for interconnection type
! Format: src_std_comm and dst_std_comm primitives carry the communities
! Use pre_tag_map to classify based on community values
!
! Example community scheme:
!   65000:100 = transit
!   65000:200 = private peering
!   65000:300 = IX/public peering
!   65000:400 = customer
!
! The communities flow through as primitives — downstream enrichment
! can parse them into human-readable interconnection types.

! --- Kafka plugin ---
plugins: kafka[sflow]

! Kafka broker configuration
kafka_broker_host[sflow]: kafka-external:9092
kafka_topic[sflow]: flow-telemetry-raw
kafka_output[sflow]: json
kafka_refresh_time[sflow]: 60

! Optional: Avro encoding (requires libavro + schema registry)
! kafka_avro_schema_registry[sflow]: http://schema-registry:8081
! kafka_output[sflow]: avro

! --- Sampling rate ---
! sfacctd handles sFlow sampling rate natively
! It renormalizes counters based on the sampling rate in the sFlow header
sfacctd_renormalize: true

! --- Pre-tagging ---
! Map routers to tags for identification
! pre_tag_map: /etc/pmacct/pretag.map

! --- Misc ---
timestamps_secs: true
writer_id_string: sfacctd-%H
